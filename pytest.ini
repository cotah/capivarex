[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow tests
addopts =
    -v
    --cov=.
    --cov-report=term-missing
    --cov-fail-under=78
filterwarnings =
    ; Suppress third-party deprecation warnings from pytest-asyncio on Python 3.14+
    ignore::DeprecationWarning:pytest_asyncio
    ; Suppress pyparsing internal deprecation warnings (pyiceberg)
    ignore::DeprecationWarning:pyparsing
    ignore::pyparsing.PyparsingDeprecationWarning
    ; Suppress asyncio.iscoroutinefunction deprecation from third-party libs on 3.14+
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning
    ; Suppress datetime.utcnow() warnings from third-party libraries we don't control
    ignore:datetime\.datetime\.utcnow\(\) is deprecated:DeprecationWarning
    ; Suppress FastAPI on_event deprecation (migrating to lifespan is a future task)
    ignore::DeprecationWarning:fastapi.applications
    ignore::DeprecationWarning:api.main
    ; Suppress Pydantic deprecation warnings from third-party libs (pyiceberg)
    ignore::DeprecationWarning:pyiceberg
    ; Suppress coroutine-not-awaited warnings from mocked async calls in tests
    ignore::RuntimeWarning
