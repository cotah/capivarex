global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'capivarex-api'
    metrics_path: /metrics
    static_configs:
      # For Docker Desktop (Windows/Mac): use host.docker.internal
      # For Linux: use the host machine's IP on the Docker network
      - targets: ['host.docker.internal:8000']
        labels:
          environment: 'development'
